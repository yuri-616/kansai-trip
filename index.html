<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="關西旅行">
  <title>關西旅行</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="appTitle">大阪・京都</h1>
      <span class="badge-pill">8 天 7 夜</span>
    </div>
    <p class="sub" id="appSub">
      <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      2026/09/26 — 2026/10/03
    </p>
  </header>

  <main>
    <section id="view-trip" class="view active"></section>
    <section id="view-money" class="view"></section>
    <section id="view-jp" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <button id="fab" class="fab" aria-label="新增記帳" hidden>＋</button>

  <nav class="tabbar">
    <button data-view="trip" class="active">
      <svg viewBox="0 0 24 24" class="ico"><path d="M9 3 3 5.5v16L9 19l6 2 6-2.5v-16L15 5 9 3Z"/><path d="M9 3v16M15 5v16"/></svg>行程</button>
    <button data-view="money">
      <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="16.8" cy="14.8" r="1.1"/></svg>記帳</button>
    <button data-view="jp">
      <svg viewBox="0 0 24 24" class="ico"><path d="M21 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2.5V11.5A7.5 7.5 0 0 1 11.5 4h2A7.5 7.5 0 0 1 21 11.5Z"/><path d="M8.5 10h8M8.5 13.5h5"/></svg>日語</button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>設定</button>
  </nav>

  <div id="sheetBackdrop" class="backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <div id="cardView" class="card-view" hidden></div>

  <script src="seed.js"></script>
  <script src="phrases.js"></script>
  <script src="app.js"></script>
</body>
</html>
